# PostgreSQL 접속 (CLI --db-url/--db-user/--db-password 로 재정의 가능)
db.url=jdbc:postgresql://localhost:5432/extract
db.user=extract
# 비밀번호는 평문으로 두지 말 것 — 환경변수 PGPASSWORD 또는 DB_PASSWORD 권장
db.password=
db.pool.max-size=5

# 스캔본 OCR 서비스 (ocr-service, CLI --ocr-url 로 재정의 가능)
ocr.service.url=http://127.0.0.1:8000
# VLM 추론은 파일당 수 분 걸릴 수 있으므로 넉넉히
ocr.service.timeout-sec=300
ocr.service.retries=2
