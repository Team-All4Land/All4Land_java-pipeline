# PostgreSQL 접속 — 로컬 실행 전제, 이 파일이 설정의 단일 출처
db.url=jdbc:postgresql://localhost:5432/extract
db.user=extract
# 비밀번호는 평문으로 두지 말 것 — 환경변수 PGPASSWORD 또는 DB_PASSWORD 권장
db.password=
db.pool.max-size=5

# 스캔본 OCR — PaddleOCR-VL CLI 서브프로세스 실행 설정
# 호출 형식: <command> <script> --source-file <이름> --file-type <형식> --output <raw.json> <입력파일...>
ocr.cli.command=python3
ocr.cli.script=ocr-cli/paddleocr_vl_cli.py
# VLM 추론은 파일당 수 분 걸릴 수 있으므로 넉넉히
ocr.cli.timeout-sec=300
